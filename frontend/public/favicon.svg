<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- The Argus mark: an all seeing eye inside an orbital ring, with a probe
       riding it. Same geometry as src/components/Logo.jsx, but with the colour
       written out rather than inherited, because a favicon has no stylesheet
       and no currentColor to read from.

       Stroke widths are nudged up from the in-app version. At 16 by 16 pixels
       a 1.2 unit stroke on a 40 unit canvas lands under half a pixel and
       disappears into the background. -->
  <rect width="40" height="40" rx="9" fill="#0b0f1e"/>
  <g transform="translate(20 20) scale(0.86) translate(-20 -20)">
    <ellipse cx="20" cy="20" rx="17" ry="9"
             transform="rotate(-22 20 20)"
             fill="none" stroke="#ffb000" stroke-width="1.9" opacity="0.75"/>
    <circle cx="20" cy="20" r="8.5" fill="none" stroke="#ffb000" stroke-width="2.2"/>
    <circle cx="20" cy="20" r="3.6" fill="#ffb000"/>
    <circle cx="35" cy="13.8" r="2.6" fill="#ffb000"/>
  </g>
</svg>
