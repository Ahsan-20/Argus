<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Short and front-loaded: a browser tab shows roughly the first twenty
         characters before it truncates, so the useful words go first. -->
    <title>Argus: we watch the page for you</title>
    <meta
      name="description"
      content="Tell Argus what you're waiting for on any public webpage, in one plain sentence. It checks for you and alerts you the moment it happens."
    />
    <meta name="theme-color" content="#0b0f1e" />
    <meta property="og:title" content="Argus" />
    <meta
      property="og:description"
      content="We watch the page, so you don't have to."
    />
    <meta property="og:type" content="website" />
    <!-- Real files rather than a data: URI. A data URI works in a browser tab
         but is invisible to everything that fetches an icon by URL: Vercel's
         dashboard, link unfurlers, bookmark managers. They look for
         /favicon.ico or a linked file, find nothing, and substitute their own
         placeholder.

         SVG first for any browser that takes it, since it stays crisp at every
         size. The .ico carries 16, 32 and 48 pixel bitmaps for everything
         else, and Safari on iOS uses the touch icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
