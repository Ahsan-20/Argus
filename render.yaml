# Render Blueprint. Point Render at this repository and it creates the service
# with the right build, start command and health check already set.
#
# The variables below are declared but deliberately left unset: they are secrets
# and are entered in the Render dashboard, never committed. Render will prompt
# for each one marked `sync: false` on first deploy.
services:
  - type: web
    name: argus-api
    runtime: docker
    plan: free
    # Nearest region to the database, which is in Tokyo. The service makes
    # several queries per request, so that hop matters more than any other.
    region: singapore
    rootDir: backend
    # Both paths are relative to rootDir, not to the repository root. The
    # Dockerfile's COPY instructions assume backend/ is the build context.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No start command: the Dockerfile's CMD binds $PORT already. The scheduler
    # runs inside this process, so one instance is all that is wanted.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production

      # Postgres connection string, including ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Signs sessions and password reset links. Generate a fresh one:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: SECRET_KEY
        sync: false

      # The deployed frontend origin. Emailed verify and reset links point here,
      # and CORS is allowed from here. Comma separated for preview deployments.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

      # This service's own public URL, used when identifying the fetcher.
      - key: PUBLIC_BASE_URL
        sync: false

      # Model providers
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Outgoing mail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # Shared secret for the manual POST /tick trigger
      - key: TICK_SECRET
        sync: false
